<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список завдань</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Список завдань</h1>

    <form id="add-form">
      <input id="title" type="text" placeholder="Нове завдання…" maxlength="200" autocomplete="off" required>
      <button type="submit">Додати</button>
    </form>

    <div class="filters">
      <button data-filter="all" class="active">Усі</button>
      <button data-filter="active">Активні</button>
      <button data-filter="done">Виконані</button>
    </div>

    <p id="message" class="message" hidden></p>
    <ul id="list"></ul>
    <p id="counter" class="counter"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
